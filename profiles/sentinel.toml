# A model-free sentinel on separate hardware: the cheapest independent voice
role = "sentinel"
probe_interval = "30s"
durability     = "host"

[states]
initial  = "online"
terminal = ["offline"]
transitions = [["online", "offline"]]

[cadence]
source   = "fixed"
online   = 15
escalate = [10, 15, 20]   # tenths: 1x, 1.5x, 2x

[listen]
to = ["*"]

[fenced]
