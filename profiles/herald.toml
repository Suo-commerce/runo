# The herald: Paperclip's signals as peer verses about lanes (a chorus of one at tier 2)
role = "herald"
probe_interval = "60s"
durability     = "host"

[states]
initial  = "online"
terminal = ["offline"]
transitions = [["online", "offline"]]

[cadence]
source   = "corpus"
online   = 15
escalate = [10, 15, 20]   # tenths: 1x, 1.5x, 2x

[listen]
to = ["lane"]

[fenced]
