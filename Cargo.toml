[workspace]
resolver = "2"
members = [
  "crates/runo-core",
  "crates/runo-profile",
  "crates/runo-cadence",
  "crates/runo-store",
  "crates/runo-clock",
  "crates/runo-fence",
  "crates/runo-node",
  "crates/runo-scribe",
  "crates/runo-adapter-paperclip",
  "crates/runo-testkit",
  "crates/runo-sim",
  "crates/runo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Suo-commerce/runo"
rust-version = "1.85"

[workspace.dependencies]
# Core crates may use only these (Runo Core Technical Specification §2, dependency policy).
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
proptest = "1"

# workspace-internal
runo-core = { path = "crates/runo-core" }
runo-profile = { path = "crates/runo-profile" }
runo-cadence = { path = "crates/runo-cadence" }
runo-store = { path = "crates/runo-store" }
runo-clock = { path = "crates/runo-clock" }
runo-fence = { path = "crates/runo-fence" }
runo-node = { path = "crates/runo-node" }
runo-scribe = { path = "crates/runo-scribe" }
runo-adapter-paperclip = { path = "crates/runo-adapter-paperclip" }
runo-testkit = { path = "crates/runo-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
