\* The protocol with activation on a partial set of acks. TLC must find S1 violated (exit 12);
\* CI asserts that it does, so the invariant is known not to be vacuous.
SPECIFICATION Spec
CONSTANTS
  Voices = {a, b, c}
  Tasks = {t1}
  MaxEpoch = 2
  MaxSeq = 1
  Replicas = {r1, r2}
  Allocator = c
  None = None
  RequireAllAcks = FALSE
INVARIANTS TypeOK S1 S2 S3 S4
