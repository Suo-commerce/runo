\* The spec's instance (tech spec section 12): three voices, one allocator, two tasks, epochs 0-2,
\* two replicas. Slower than Runo-small.cfg; run it before a release of the model.
SPECIFICATION Spec
CONSTANTS
  Voices = {a, b, c}
  Tasks = {t1, t2}
  MaxEpoch = 2
  MaxSeq = 1
  Replicas = {r1, r2}
  Allocator = c
  None = None
  RequireAllAcks = TRUE
INVARIANTS TypeOK S1 S2 S3 S4
PROPERTIES L1 SnapshotFixed FenceMonotone
