name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-deny --locked && cargo deny check
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npx jscpd@4 crates runo-replay
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m py_compile runo-replay/*.py
      - run: bash -n runo-replay/export-paperclip.sh
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: S1-S4 and L1 hold on the one-task instance
        run: java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -deadlock -config model/Runo-small.cfg model/Runo.tla
      - name: S1 is not vacuous (activation on partial acks must fail it)
        run: |
          set +e
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -deadlock -config model/Runo-broken.cfg model/Runo.tla > broken.log 2>&1
          code=$?
          grep -q "Invariant S1 is violated" broken.log && [ "$code" -eq 12 ]
